
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueueFlow — Queue & Appointment Management for Service Businesses</title>
    <meta name="description" content="QueueFlow is a virtual queue and appointment management platform for government offices, clinics, retail, and campuses — real-time queueing, QR check-in, staff dashboards, analytics, and multilingual support." />
    <meta name="author" content="QueueFlow" />

    <meta property="og:title" content="QueueFlow — Queue & Appointment Management" />
    <meta property="og:description" content="Virtual queue and appointment management for service businesses: real-time queueing, QR check-in, staff dashboards, and analytics." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Explicit icon links: without them browsers probe /favicon.ico and
         /apple-touch-icon.png at the origin root, which 404s on a sub-path deploy. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="icon" type="image/png" href="/pwa-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Web fonts are self-hosted (public/fonts, @font-face in
         src/styles/fonts.css). The two faces that draw the first screen are
         preloaded so they arrive with the entry bundle instead of after the
         CSS has been parsed and the hero rendered. Vite rewrites the /fonts/
         URLs for `base`. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin-400-700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/bricolage-grotesque-latin-600-700.woff2" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
