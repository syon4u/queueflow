
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueueFlow — Queue & Appointment Management for Service Businesses</title>
    <meta name="description" content="QueueFlow is a virtual queue and appointment management platform for government offices, clinics, retail, and campuses — real-time queueing, QR check-in, staff dashboards, analytics, and multilingual support." />
    <meta name="author" content="QueueFlow" />

    <meta property="og:title" content="QueueFlow — Queue & Appointment Management" />
    <meta property="og:description" content="Virtual queue and appointment management for service businesses: real-time queueing, QR check-in, staff dashboards, and analytics." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Explicit icon links: without them browsers probe /favicon.ico and
         /apple-touch-icon.png at the origin root, which 404s on a sub-path deploy. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="icon" type="image/png" href="/pwa-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Web fonts (Google Fonts, display=swap). Loaded non-blocking: the
         stylesheet applies once fetched instead of holding up first paint;
         `media="print"` keeps it off the render path until `onload` flips it.
         Weights are trimmed to what the app uses: Inter 400-700 (body/UI),
         Merriweather 400/700 (app headings), Bricolage Grotesque with the
         opsz/wdth axes the landing type roles dial, Instrument Serif italic
         (landing accent). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..700&family=Instrument+Serif:ital@1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..700&family=Instrument+Serif:ital@1&display=swap" />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
